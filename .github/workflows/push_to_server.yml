
name: "Build and deploy Jupyter Book"

on:
  workflow_call:


permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    environment: production

    env:
      LOCAL_BUILD_DIR: _build/html
      MIN_SECONDS_BETWEEN_DEPLOYS: "60"
      DEPLOY_STAMP_FILE: /var/tmp/last-github-deploy.timestamp
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client
          python -m pip install --upgrade pip
          pip install mystmd

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WEBSITE_UPLOAD_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          cat > ~/.ssh/config <<'EOF'
          Host deploy-target
            BatchMode yes
            IdentitiesOnly yes
            IdentityFile ~/.ssh/deploy_key
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            PreferredAuthentications publickey
            PasswordAuthentication no
          EOF

          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          ssh deploy-target \
            -l "$DEPLOY_USER" \
            -o HostName="$DEPLOY_HOST" \
            true

      - name: Enforce minimum deployment interval
        run: |
          LAST=$(
            ssh deploy-target \
              -l "$DEPLOY_USER" \
              -o HostName="$DEPLOY_HOST" \
              "cat '$DEPLOY_STAMP_FILE' 2>/dev/null || echo 0"
          )

          NOW=$(date +%s)
          DIFF=$((NOW - LAST))

          if [ "$DIFF" -lt "$MIN_SECONDS_BETWEEN_DEPLOYS" ]; then
            WAIT=$((MIN_SECONDS_BETWEEN_DEPLOYS - DIFF))
            echo "Waiting $WAIT seconds..."
            sleep "$WAIT"
          fi

      - name: Build Jupyter Book
        run: |
          myst build --html
          test -d "$LOCAL_BUILD_DIR"

      - name: Deploy with rsync
        run: |
          rsync -ravz --delete \
            --exclude='.ssh/' \
            -e "ssh -F $HOME/.ssh/config -o HostName=$DEPLOY_HOST" \
            "$LOCAL_BUILD_DIR/" \
            "$DEPLOY_USER@deploy-target:$DEPLOY_PATH/"

      - name: Update deployment timestamp
        run: |
          ssh deploy-target \
            -l "$DEPLOY_USER" \
            -o HostName="$DEPLOY_HOST" \
            "date +%s > '$DEPLOY_STAMP_FILE'"
